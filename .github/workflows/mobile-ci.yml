name: Mobile CI

on:
  pull_request:
    branches: [main, "Sprint-*"]
    paths: ["mobile/**", ".github/workflows/mobile-ci.yml"]
  push:
    branches: [main, "Sprint-*"]
    paths: ["mobile/**", ".github/workflows/mobile-ci.yml"]

defaults:
  run:
    working-directory: mobile

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Strings sorted (fewer merge conflicts)
        run: dart run tool/sort_arb.dart --check

      - name: Generate localisations
        run: flutter gen-l10n

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed $(find lib test -name '*.dart' -not -path '*/generated/*')

      - name: Analyze
        run: flutter analyze

      - name: Design tokens (no colours outside the theme)
        run: bash tool/check_design_tokens.sh

      - name: Tests
        run: flutter test
