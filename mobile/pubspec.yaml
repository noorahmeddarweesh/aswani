name: aswani
description: "Aswani - your smart guide to exploring Aswan."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.4
  intl: any
  lucide_icons_flutter: ^4.0.3
  material_ui: ^1.11.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  # Generates AppLocalizations from lib/core/l10n/*.arb (see l10n.yaml).
  generate: true

  assets:
    - assets/images/onboarding/
    - assets/images/home/
    - assets/images/places/

  # Open Font License fonts (licences in assets/fonts/OFL-*.txt).
  # Family names must match AppTypography.
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Light.ttf
          weight: 300
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlayfairDisplay-Medium.ttf
          weight: 500
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700

# App icon. Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#173B63"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  min_sdk_android: 24

# Native splash (shown while Flutter starts).
# Regenerate with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#173B63"
  image: assets/branding/splash_logo.png
  android_12:
    color: "#173B63"
    image: assets/branding/splash_logo.png
  fullscreen: false
